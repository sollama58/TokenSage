previews:
  generation: off

envVarGroups:
  - name: tokensage-shared
    envVars:
      - key: LOG_LEVEL
        value: info
      - key: HTTP_USER_AGENT
        value: "TokenSage/0.1 (+https://github.com/sollama58/TokenSage)"
      - key: ACCEPT_NON_PUMP
        value: "true"
      - key: ENABLE_CLIP # logo labels at full depth; the Docker image ships the model
        value: "true"
      - key: VISION_MODEL_PATH
        value: /app/models/siglip
      - key: ENABLE_EMBED
        value: "false" # needs EMBED_MODEL_PATH (MiniLM ONNX + vocab.txt) when true
      - key: ENABLE_CORPUS
        value: "false"
      - key: ENABLE_PAID_X
        value: "false"
      - key: PAID_X_DAILY_USD_CAP
        value: "1.00"
      - key: IPFS_GATEWAYS
        value: "https://pump.mypinata.cloud,https://ipfs.filebase.io,https://dweb.link,https://ipfs.io,https://gateway.pinata.cloud"
      # Helius plan for the admin panel's credit gauge (/admin); nothing throttles on it.
      # Free: 1000000 and 10; Developer: 10000000 and 50 (the plan since 2026-10-17).
      # BILLING_DAY is the day of the month credits reset.
      - key: HELIUS_PLAN_CREDITS
        value: "10000000"
      - key: HELIUS_RPS_LIMIT
        value: "50"
      - key: HELIUS_BILLING_DAY
        value: "1"

services:
  - type: web
    name: tokensage-api
    runtime: docker
    plan: starter # not free: a free service sleeps after 15 min idle
    region: oregon
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    healthCheckPath: /healthz
    # Deploy once CI is green on the commit, not on the push: a red main (a merge skew) stayed
    # out of production only by luck (2026-10-27 audit DB-5). Same on every service below.
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["tokensage/**", "migrations/**", "alembic.ini", "data/**", "Dockerfile", "pyproject.toml", "uv.lock", "render.yaml"]
      ignoredPaths: ["**/*.md", "tests/**", "docs/**"]
    envVars:
      - fromGroup: tokensage-shared
      - key: TOKENSAGE_ROLE # picks the entrypoint (tokensage/run.py); no dockerCommand
        value: api
      - key: DATABASE_URL
        fromDatabase: { name: tokensage-db, property: connectionString }
      - key: API_KEYS # "consumer:<long random key>" pairs, comma-separated
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: MONITOR_KEY # read-only key for the monitoring GETs under /admin/v1; unset = off
        sync: false
      - key: INLINE_ANALYZER
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: FULL_PER_DAY_DEFAULT # full analyses per key per UTC day; 700 coins/h is 16,800
        value: "20000"
      - key: RATE_PER_MIN_DEFAULT # requests per key per minute, job polls included
        value: "300"

  - type: worker
    name: tokensage-analyzer
    runtime: docker
    plan: standard # 2 GB: 12 concurrent jobs (OCR off since 2026-10-16) + RapidOCR (~250 MB) + SigLIP (~220 MB) outgrow 512 MB
    region: oregon
    dockerfilePath: ./Dockerfile
    numInstances: 1
    maxShutdownDelaySeconds: 60
    # The analyzer can boot before the api's pre-deploy has migrated: it migrates too, and the
    # two runs take turns (migrations/env.py, advisory lock), so the second is a no-op.
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["tokensage/**", "data/**", "Dockerfile", "pyproject.toml", "uv.lock", "render.yaml"]
      ignoredPaths: ["**/*.md", "tests/**", "docs/**"]
    envVars:
      - fromGroup: tokensage-shared
      - key: TOKENSAGE_ROLE # picks the entrypoint (tokensage/run.py); no dockerCommand
        value: worker
      - key: WORKER_CONCURRENCY # jobs in flight at once; each holds one DB connection
        value: "12"
      - key: OCR_CONCURRENCY # RapidOCR is ~250 MB per concurrent read
        value: "1"
      - key: DATABASE_URL
        fromDatabase: { name: tokensage-db, property: connectionString }
      - key: SOLANA_RPC_URL # HTTPS RPC, e.g. Helius free tier (includes the api key)
        sync: false
      - key: SOLANA_WS_URL # only needed when ENABLE_CORPUS=true
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: TWITTERAPI_IO_KEY # optional paid X fallback
        sync: false
      - key: TRUSTED_HINT_KEYS # key names whose hints are first-party, e.g. "trenchscanner"
        sync: false

  - type: cron
    name: tokensage-knowledge
    runtime: docker
    plan: starter
    region: oregon
    schedule: "17 3 * * *" # daily 03:17 UTC
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    envVars:
      - fromGroup: tokensage-shared
      - key: TOKENSAGE_ROLE # picks the entrypoint (tokensage/run.py); no dockerCommand
        value: knowledge
      - key: DATABASE_URL
        fromDatabase: { name: tokensage-db, property: connectionString }
      - key: COINGECKO_API_KEY
        sync: false

  - type: cron
    name: tokensage-maintenance
    runtime: docker
    plan: starter
    region: oregon
    schedule: "7 * * * *" # hourly
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    envVars:
      - fromGroup: tokensage-shared
      - key: TOKENSAGE_ROLE # picks the entrypoint (tokensage/run.py); no dockerCommand
        value: maintenance
      - key: DATABASE_URL
        fromDatabase: { name: tokensage-db, property: connectionString }

databases:
  - name: tokensage-db
    plan: basic-256mb # 'free' expires after 30 days
    # Disk: Render's default 15 GB (no diskSizeGB here). Nothing was pruned until 2026-10-16
    # (database audit, I1); the hourly maintenance now condenses every analysis after 7 days
    # (about 60% of it), keeps a token's heavy rows 30 days and the slim token row 90
    # (ANALYSIS_CONDENSE_DAYS, TOKEN_DETAIL_RETENTION_DAYS, TOKEN_RETENTION_DAYS in config.py),
    # which should settle around 6-9 GB at the 2026-10-17 read volume. The admin status reports
    # the database size and its largest tables; raise diskSizeGB (a multiple of 5) or set
    # storageAutoscalingEnabled: true before it nears the disk.
    region: oregon
    databaseName: tokensage
    user: tokensage
    postgresMajorVersion: "17"
    ipAllowList: [] # private network only
