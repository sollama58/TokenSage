# The "current pump.fun meta" signal (guide §5.5, §5.8): how many coins with this name, or
# with a word of it, launched around this token, against our longer token history.
# Config, not code. Tune after calibration (Phase 6).

window_hours: 24        # "launched within 24 h of this token" (either side of its launch)
history_days: 90        # the long-run baseline a word's recent share is compared against

# The whole name: launched this many times within the window (this token included) = a meta.
min_name_count: 5
# One word of the name: in at least this many names in the window, and at least
# `min_word_lift` times its usual share of names in the history.
min_word_count: 5
min_word_lift: 3.0
min_word_len: 3
max_words: 6            # words looked up per token

# Evidence weight (label launch_meta, a corpus fact that scores no category): base + step *
# log2(count / min_count + 1), capped. A word-level meta is worth `word_factor` of a
# whole-name one.
weight_base: 0.35
weight_step: 0.1
weight_max: 0.75
word_factor: 0.8

# Referent "current pump.fun meta: <word>", used only when nothing else resolves. A whole
# name launched many times gets no referent of its own: a copy is about its original.
referent_score_word: 0.4

# Words that never make a meta on their own (they are in every other coin name).
stop_words: [coin, token, the, and, sol, solana, pump, fun, meme, official, inu, cto, dao, army,
             gang, club, wif, hat, moon, rocket, baby, mini, lil, king, queen, god, lord, boss,
             real, classic, edition, season, szn, mode, era, vibes, maxi, money, cash, bag, world,
             nation, party, time, life, for, with, from, you, your, this, that, not, but, all,
             new, just, its, are, was, has, have]

# The day's most-traded pump.fun tokens (GeckoTerminal, refreshed by the daily knowledge cron).
# A coin that shares a name, ticker or name word with one of them is riding today's meta.
top_volume:
  count: 25
  dexes: [pump-fun, pumpswap]   # GeckoTerminal dex ids: the bonding curve and PumpSwap
  pages: 2                      # 20 pools per page, per dex
  keep_days: 45
  name_weight: 0.6              # same name or ticker as a top token
  word_weight: 0.45             # shares a name word with a top token
  self_weight: 0.5              # the token is itself in the top list
  referent_score_word: 0.4

# Lineage (engine/lineage.py): which copy this is. rank is the same-name copy rank above;
# ages are from the original's launch to this coin's.
lineage:
  early_max_rank: 3               # early_copy: rank <= 3 ...
  early_max_original_age_h: 6     # ... and the original launched less than 6 h earlier
  late_min_rank: 11               # late_copy: rank > 10 ...
  late_min_original_age_h: 24     # ... or the original launched more than 24 h earlier
  logo_scan_days: 7               # logo near-duplicates are searched this far back
  logo_reused_min: 3              # flag logo_reused at this many other coins in 24 h
  inherit_factor: 0.8             # a copy with no theme of its own inherits the original's
