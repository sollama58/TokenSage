# Chinese word list for coin names (review recommendation 7). Hand-written for TokenSage and
# released under CC0 1.0 (public domain); no entries are copied from CC-CEDICT or any other
# dictionary.
#
# Han text in a name or description is translated with this list before it is folded to
# ASCII: the longest entry wins at each position (中国龙 -> "china dragon"), and characters
# with no entry fall back to pinyin as before. A value of "" drops the character (particles
# such as 的 carry no meaning on their own). Translations are chosen to land on words the
# slang lexicon, the entity seed and the WordNet classes already know.
