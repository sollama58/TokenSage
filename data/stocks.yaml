# Listed companies and ETFs that coins reference, and the underlyings of tokenized stocks
# (Backed "xStocks" on Solana: TSLAx, NVDAx, SPYx, ... = ticker + "x"). Used two ways:
# - a coin paired against an xStock (or named after a stock) is read in that stock's light
# - company names and tickers become lexicon entities ("Tesla", "$NVDA", "TSLAx")
#
# aliases: extra surfaces matched as words. The ticker is added automatically unless
# ticker_is_word (COIN, HOOD, SPY, META, ...): a common word must not read as a stock.
# The company name is added unless name_is_word (Apple, Meta, Oracle, Visa, ...): then only
# the aliases given here (e.g. "apple inc") count.
# categories: beyond tradfi/stock (or tradfi/index_etf for kind: etf).
stocks:
