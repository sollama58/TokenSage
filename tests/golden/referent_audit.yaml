# Referent regression set (rules 0.30.0): cases rebuilt from the hand-audited reads of
# 2026-10-12 (notes: tokensage-deep-eval-2026-10-12.md, read-audit/sample*.json and
# result*.json). Each case is a realistic input (name, ticker, description, the linked X post
# and the posts it quotes) for a read the audit judged wrong or too generic, plus a few the
# audit judged right (controls). `audit` is the read's id in the audit; `pattern` the failure:
#   post_subject   the post names the subject; the read gave a bucket ("news event", "mouse")
#   news_timing    news_event set by an older post with no news content
#   homonym        a Wikipedia page or lexicon entry that only shares the word
#   substring      a piece of a longer word, or a dictionary word inside a phrase
#   incidental     a chain, platform, tool or tagged account mentioned in passing
#   category       a category set by the trading pair, the fee text or the word "memecoin"
#   control        a read the audit judged right; it must stay right
#
# Inputs (no network, no database; the case runs at full depth when it has `x`, `wiki`,
# `trending` or `pair`, else at basic depth):
#   name, symbol, description
#   x: the linked post {text, author, author_name, followers, verified, posted_s_before,
#      quoted: {...same fields}}
#   wiki: Wikipedia search results {span: title/desc}: when the engine asks for a span
#         (wikilookup.spans), the page is handed to wikilookup.pick as the top result
#   trending: [{term, source, spike, views}] trend terms, as in cases.yaml
#   pair: {symbol, name, kind, mint}   extra_coins: [{symbol, name, label, kind, desc, categories}]
# Expectations (all optional):
#   referent        the reported referent's label contains this (case-insensitive)
#   referent_not    the label contains none of these (a missing referent passes)
#   label_not       the label is none of these (exact, case-insensitive): a post clause that
#                   mentions the tool is fine, the tool as the referent is not
#   desc_not        the desc contains none of these
#   referent_source the reported source (exact)
#   specific        true: a referent that is not generic
#   referent_null   true: no referent at all
#   categories_exclude / categories_include: labels
