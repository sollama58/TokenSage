# Golden meaning cases (guide §9 Phase 3). Each case runs the engine with no network and no
# database. Assertions:
#   categories_include / categories_exclude : labels that must / must not reach min confidence
#   top_category                            : the highest-scoring label must start with this
#   referent                                : referent.label must contain this (case-insensitive)
#   no_referent                             : true -> referent must be null or score < 0.45
#   flags_include / flags_exclude           : flag codes
#   ticker_method                           : ticker explanation method
#   copy_of_includes                        : known-coin tickers that must appear in copy_of
#   copy_of_excludes                        : tickers that must NOT appear
#   tokens                                  : exact normalized name tokens
#   obfuscation_include                     : obfuscation codes
cases:
  # ---------------------------------------------------------------- the famous ones (self)
  - name: dogwifhat
    symbol: WIF
    categories_include: [animal/dog, meme_template/x_wif_hat]
    referent: dogwifhat
    ticker_method: known_coin
    copy_of_excludes: [WIF]
    flags_exclude: [copycat]
  - name: Peanut the Squirrel
    symbol: PNUT
    description: "Justice for Peanut 🐿"
