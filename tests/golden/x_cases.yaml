# Golden cases for the X link vs token comparison (x.match, depth=full). No network, no DB.
# Images are synthetic: "img:<seed>" is a deterministic pattern, "img:<seed>:edit" the same
# pattern with a small overlay (an edited copy), so pHash distances behave like real logos.
#
# token: name, symbol, description, logo (image spec or null)
# link: tweet | profile
# tweet: text, author, followers, verified, hours_before_token (negative = after), media,
#        author_joined_days_before (default 900),
#        quoted: {text, author, followers, hours_before_token, media}
# profile: name, handle, bio, followers, statuses, avatar, banner,
#          joined_hours_before (default 30 days)
# expect: verdict, fit_min, fit_max, name_how, ticker_how, image_min_score, agrees,
#         flags_include, flags_exclude, basis_include, basis_exclude, made_for_coin,
#         credibility_min, credibility_max
cases:
  # ---- the three cases from the consumer brief
  - id: copies_viral_post_image_and_words
    token: {name: "Bongo the Skating Hamster", symbol: BONGO, logo: "img:11"}
    link: tweet
    tweet:
      text: "my hamster Bongo just learned to ride a skateboard 🛹"
      author: hamsterdiaries
      followers: 812000
      hours_before_token: 5
      media: ["img:11"]
    expect:
      verdict: about_this_coin
      fit_min: 0.9
      name_how: segment
      image_min_score: 1.0
      flags_include: [x_image_match]
      flags_exclude: [x_content_mismatch]

  - id: unrelated_large_account_post
    token: {name: "Moon Cat", symbol: MCAT, logo: "img:21"}
    link: tweet
    tweet:
      text: "The future of space travel is fully reusable rockets"
      author: elonmusk
      followers: 190000000
      verified: blue
      hours_before_token: 48
      media: ["img:22"]
    expect:
      verdict: unrelated
      fit_max: 0.19
      name_how: none
      ticker_how: none
      flags_include: [x_content_mismatch, borrowed_narrative]
      flags_exclude: [x_image_match]

  - id: post_carries_only_the_contract_address
    # "CA: <mint>" and nothing else: the launch post, not a mismatch (audit 0.28 EC-2)
    token: {name: "Zorblax", symbol: ZORB, logo: "img:31"}
    link: tweet
    tweet:
      text: "CA: So11111111111111111111111111111111111111112"
      author: zorbdev
      followers: 40
      hours_before_token: 1
      media: []
    expect:
      verdict: about_this_coin
      fit_min: 0.95
      name_how: none
      ticker_how: contract
      basis_include: [post_text]
      basis_exclude: [cashtag]
      flags_exclude: [x_content_mismatch]

  - id: post_only_mentions_the_cashtag
    token: {name: "Zorblax", symbol: ZORB, logo: "img:31"}
    link: tweet
    tweet:
      text: "$ZORB just launched, lfg 🚀"
      author: zorbdev
      followers: 40
      hours_before_token: -0.1
      media: []
    expect:
      verdict: related
      fit_min: 0.4
      fit_max: 0.59
      name_how: none
      ticker_how: cashtag
      flags_exclude: [x_content_mismatch, x_image_match]

  # ---- more coverage
  - id: launch_post_with_name_and_cashtag_and_logo
    token: {name: "Pepe Wizard", symbol: PWIZ, logo: "img:41"}
    link: tweet
    tweet:
      text: "Pepe Wizard is live. $PWIZ 🧙🐸"
      author: pwizcoin
      followers: 120
      hours_before_token: -0.05
      media: ["img:41:edit"]
    expect:
      verdict: about_this_coin
      fit_min: 0.95
      name_how: exact
      ticker_how: cashtag
      image_min_score: 0.7
      basis_include: [post_text, cashtag, post_image]
      flags_include: [x_image_match]

  - id: camelcase_name_normalized_in_post
    token: {name: "DogWifCrown", symbol: CROWN, logo: null}
    link: tweet
    tweet:
      text: "dog wif crown szn 👑"
      author: crowndog
      followers: 300
      hours_before_token: -0.2
    expect:
      verdict: about_this_coin
      name_how: normalized

  - id: hashtag_ticker
    token: {name: "Glorp", symbol: GLORP, logo: null}
    link: tweet
    tweet:
      text: "who is ready #GLORP"
      author: glorper
      followers: 15
      hours_before_token: -0.1
    expect:
      # the name is the tagged word itself: a strong match on both counts
      name_how: exact
      ticker_how: hashtag
      verdict: about_this_coin

  - id: everyday_word_ticker_lowercase_is_not_a_match
    token: {name: "Sunny Pup", symbol: DOG, logo: null}
    link: tweet
    tweet:
      text: "walked the dog in the park today"
      author: someone
      followers: 900
      hours_before_token: 30
    expect:
      ticker_how: none

  - id: different_referent_disagrees
    token: {name: "Peanut the Squirrel", symbol: PNUTS, logo: null}
    link: tweet
    tweet:
      text: "Moo Deng the baby pygmy hippo is the cutest thing on the internet"
      author: zoofan
      followers: 5000
      hours_before_token: 10
    expect:
      agrees: false
      verdict: unrelated
      flags_include: [x_content_mismatch]

  - id: same_referent_in_other_words
    token: {name: "Peanut the Squirrel", symbol: PNUTS, logo: null}
    link: tweet
    tweet:
      text: "RIP Peanut the squirrel, the pet NY officials seized and put down"
      author: newsbot
      followers: 20000
      hours_before_token: 20
    expect:
      agrees: true
      verdict: about_this_coin

  - id: name_word_gives_a_referent_the_post_agrees_with
    # "peanut" on its own resolves to Peanut the squirrel (a distinctive word of a known
    # coin's name), and the post is about the same squirrel: the two agree
    token: {name: "Justice for Peanut", symbol: JFP, logo: null}
    link: tweet
    tweet:
      text: "RIP Peanut the squirrel, NY officials took him away"
      author: newsbot
      followers: 20000
      hours_before_token: 20
    expect:
      name_how: segment
      verdict: about_this_coin
      flags_exclude: [x_content_mismatch]

  - id: quote_tweet_text_counts
    token: {name: "Bongo the Skating Hamster", symbol: BONGO, logo: "img:12"}
    link: tweet
    tweet:
      text: "launching this, gm"
      author: bongodev
      followers: 30
      hours_before_token: -0.1
      quoted:
        text: "my hamster Bongo learned to skateboard"
        author: hamsterdiaries
        followers: 812000
        hours_before_token: 5
        media: ["img:12"]
    expect:
      verdict: about_this_coin
      image_min_score: 1.0
      flags_include: [x_image_match]

  - id: profile_link_avatar_is_the_logo
    token: {name: "Fwogcito", symbol: FWOGC, logo: "img:51"}
    link: profile
    profile:
      name: "Fwogcito"
      handle: fwogcito
      bio: "the smallest fwog on solana"
      followers: 210
      avatar: "img:51"
    expect:
      verdict: about_this_coin
      name_how: exact
      flags_include: [x_image_match]

  - id: deleted_tweet_is_unknown_not_mismatch
    token: {name: "Ghost Coin", symbol: GHOST, logo: "img:61"}
    link: tweet
    tweet: {deleted: true}
    expect:
      verdict: unknown
      flags_exclude: [x_content_mismatch]

  # ---- credibility apart from fit; self-made profiles (brief 2026-10-07 §5)
  - id: self_made_profile_name_only_is_capped
    # a profile named after the coin, made minutes before it, with nothing else to say
    token: {name: "Glimmerdog", symbol: GLIMD, logo: "img:71"}
    link: profile
    profile:
      name: "Glimmerdog"
      handle: glimmerdog
      followers: 12
      statuses: 3
      joined_hours_before: 0.12
    expect:
      verdict: related
      fit_max: 0.55
      basis_include: [profile_name]
      basis_exclude: [profile_bio]
      made_for_coin: true
      credibility_max: 0.1
      flags_include: [x_account_made_for_coin]

  - id: self_made_profile_with_logo_avatar_is_still_capped
    # the avatar is set by the same person at the same time: no more evidence than the name
    token: {name: "Glimmerdog", symbol: GLIMD, logo: "img:71"}
    link: profile
    profile:
      name: "Glimmerdog Official"
      handle: GlimmerdogSol
      followers: 40
      statuses: 5
      avatar: "img:71"
      joined_hours_before: -0.5
    expect:
      verdict: related
      basis_include: [profile_name, profile_image]
      made_for_coin: true
      flags_include: [x_account_made_for_coin, x_image_match]

  - id: self_made_profile_whose_bio_names_the_coin_is_not_capped
    token: {name: "Glimmerdog", symbol: GLIMD, logo: "img:71"}
    link: profile
    profile:
      name: "Glimmerdog"
      handle: glimmerdog
      bio: "$GLIMD, the glimmering dog of solana. CA in pinned"
      followers: 12
      joined_hours_before: 2
    expect:
      verdict: about_this_coin
      basis_include: [profile_name, profile_bio, cashtag]
      made_for_coin: true
      flags_include: [x_account_made_for_coin]

  - id: established_profile_named_like_the_coin
    # the account predates the token by over a year: the name match counts in full
    token: {name: "Glimmerdog", symbol: GLIMD, logo: "img:71"}
    link: profile
    profile:
      name: "Glimmerdog"
      handle: glimmerdog
      followers: 52000
      statuses: 4100
      joined_hours_before: 9600
    expect:
      verdict: about_this_coin
      fit_min: 0.85
      made_for_coin: false
      credibility_min: 0.6
      flags_exclude: [x_account_made_for_coin, fresh_x_account]

  - id: fresh_author_launch_post
    # a launch post from an account made for the coin: matches, but is worth little
    token: {name: "Zorblax", symbol: ZORB, logo: "img:31"}
    link: tweet
    tweet:
      text: "Zorblax is live $ZORB"
      author: zorblax
      followers: 9
      hours_before_token: -0.1
      author_joined_days_before: 0.01
    expect:
      verdict: about_this_coin
      basis_include: [post_text, cashtag]
      made_for_coin: true
      credibility_max: 0.1
      flags_include: [x_account_made_for_coin]
