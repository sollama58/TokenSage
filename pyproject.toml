[project]
name = "tokensage"
version = "0.1.0"
description = "Explains what a pump.fun token means, given its contract address."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "structlog>=24.1",
    "pyyaml>=6.0.3",
    "wordsegment>=1.3.1",
    "rapidfuzz>=3.14.6",
    "anyascii>=0.3.3",
    "confusable-homoglyphs>=3.3.1",
    "emoji>=2.16.0",
    "pyahocorasick>=2.3.1",
    "pillow>=12.3.0",
    "imagehash>=4.3.2",
    "numpy>=2.5.3",
    "rapidocr-onnxruntime>=1.4.4",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tokensage"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "nltk>=3.10.3",
    "types-pyyaml>=6.0.12.20260906",
]
