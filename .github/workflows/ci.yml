name: CI

# main on push (Render deploys on its green checks); every other branch through its PR. A
# branch push used to run twice, once for the push and once for the PR (2026-10-27 audit
# CH-13: 14 of 26 commits).
on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same PR stops the run it replaces; main's runs all finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # the suite takes a few minutes; a hung test used to hold the runner for GitHub's 6 h
    timeout-minutes: 20
    # PostgreSQL 17, production's major, installed from the PostgreSQL apt repository by
    # scripts/ci-postgres.sh as TrenchScanner's CI does: a postgres service container pulls
    # anonymously from Docker Hub or a mirror, whose shared-IP quotas fail a run before its
    # first step (2026-10-27 audit CH-13; ECR Public answered "Data limit exceeded" on #97's
    # first run), and the runner image's own PostgreSQL is 16 (full audit 2026-11-02, TS-7).
    env:
      DATABASE_URL: postgresql://tokensage:tokensage@localhost:5432/tokensage
      # the DB-backed tests skip when Postgres is unreachable; in CI that is a failure
      TS_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 17
        run: ./scripts/ci-postgres.sh
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-extras --python 3.12
      - name: Lint
        run: uv run ruff check tokensage tests scripts && uv run ruff format --check tokensage tests scripts
      - name: Type check
        run: uv run mypy tokensage scripts
      - name: OpenAPI contract is committed and current
        run: uv run python scripts/export_openapi.py --check
      - name: Tests
        run: uv run pytest -q
