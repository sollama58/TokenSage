name: CI

# main on push (Render deploys on its green checks); every other branch through its PR. A
# branch push used to run twice, once for the push and once for the PR (2026-10-27 audit
# CH-13: 14 of 26 commits).
on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same PR stops the run it replaces; main's runs all finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # the suite takes a few minutes; a hung test used to hold the runner for GitHub's 6 h
    timeout-minutes: 20
    # The runner image's own PostgreSQL (16; installed, service off), started below, as
    # TrenchScanner's CI does: a postgres service container pulls anonymously from Docker Hub
    # or a mirror, whose shared-IP quotas fail a run before its first step (2026-10-27 audit
    # CH-13; ECR Public answered "Data limit exceeded" on this PR's first run).
    env:
      DATABASE_URL: postgresql://tokensage:tokensage@localhost:5432/tokensage
      # the DB-backed tests skip when Postgres is unreachable; in CI that is a failure
      TS_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE USER tokensage WITH SUPERUSER PASSWORD 'tokensage';" \
            -c "CREATE DATABASE tokensage OWNER tokensage;"
          pg_isready -h localhost -p 5432 -U tokensage
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-extras --python 3.12
      - name: Lint
        run: uv run ruff check tokensage tests scripts && uv run ruff format --check tokensage tests scripts
      - name: Type check
        run: uv run mypy tokensage scripts
      - name: OpenAPI contract is committed and current
        run: uv run python scripts/export_openapi.py --check
      - name: Tests
        run: uv run pytest -q
